services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: es
      POSTGRES_PASSWORD: es
      POSTGRES_DB: event_sourcing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U es -d event_sourcing']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://es:es@db:5432/event_sourcing
      PORT: '3000'
      # 读模型兜底跟进轮询间隔（毫秒）；设为 0 关闭（落后仍会通过接口 lagEvents/caughtUp 暴露）
      PROJECTION_CATCH_UP_POLL_MS: '1000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
